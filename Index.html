<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recipes</title>

<style>
body{
font-family:Arial,sans-serif;
margin:20px;
background:#fffaf5;
}

input,textarea{
width:100%;
padding:10px;
margin:5px 0;
}

button{
padding:10px;
margin:5px;
cursor:pointer;
}

.recipe{
border:1px solid #ccc;
padding:15px;
margin-top:10px;
background:white;
}
</style>
</head>

<body>

<h1>Dusty Apron Recipe Vault</h1>

<input id="search" placeholder="Search recipes">

<h2>Add Recipe</h2>

<input id="name" placeholder="Recipe name">

<textarea id="ingredients"
placeholder="Ingredients"></textarea>

<textarea id="instructions"
placeholder="Instructions"></textarea>

<button onclick="addRecipe()">Save Recipe</button>

<hr>

<div id="recipes"></div>

<script>

let recipes =
JSON.parse(localStorage.getItem("recipes")) || [];

function save(){
localStorage.setItem(
"recipes",
JSON.stringify(recipes)
);
render();
}

function addRecipe(){

const recipe={
id:Date.now(),
name:document.getElementById("name").value,
versions:[{
date:new Date().toLocaleString(),
ingredients:document.getElementById("ingredients").value,
instructions:document.getElementById("instructions").value
}]
};

recipes.push(recipe);

document.getElementById("name").value="";
document.getElementById("ingredients").value="";
document.getElementById("instructions").value="";

save();
}

function updateRecipe(id){

const recipe=
recipes.find(r=>r.id===id);

const ingredients=
prompt("New ingredients:");

const instructions=
prompt("New instructions:");

if(!ingredients || !instructions) return;

recipe.versions.push({
date:new Date().toLocaleString(),
ingredients,
instructions
});

save();
}

function render(){

const search=
document.getElementById("search")
.value.toLowerCase();

const container=
document.getElementById("recipes");

container.innerHTML="";

recipes
.filter(r =>
r.name.toLowerCase().includes(search))
.forEach(recipe=>{

const latest=
recipe.versions[
recipe.versions.length-1
];

const div=
document.createElement("div");

div.className="recipe";

div.innerHTML=`
<h3>${recipe.name}</h3>

<p>
Versions:
${recipe.versions.length}
</p>

<button onclick="updateRecipe(${recipe.id})">
Update
</button>

<button onclick="
this.nextElementSibling.style.display=
this.nextElementSibling.style.display==='none'
?'block':'none'
">
History
</button>

<div style="display:none">

${recipe.versions.map(v=>`

<hr>

<b>${v.date}</b>

<h4>Ingredients</h4>
<pre>${v.ingredients}</pre>

<h4>Instructions</h4>
<pre>${v.instructions}</pre>

`).join("")}

</div>

<hr>

<h4>Current Recipe</h4>

<pre>${latest.ingredients}</pre>

<pre>${latest.instructions}</pre>
`;

container.appendChild(div);
});
}

document
.getElementById("search")
.addEventListener("input",render);

render();

</script>

</body>
</html>
