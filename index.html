<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipes</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f0fbff;
color:#17384a;
}

header{
background:linear-gradient(135deg,#0088cc,#00b7a8);
color:white;
padding:30px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #b7dce8;
border-radius:10px;
font-size:16px;
}

textarea{
resize:vertical;
}

button{
background:#009fc2;
color:white;
border:none;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
margin:4px;
font-size:15px;
}

button:hover{
background:#007fa3;
}

.recipe{
background:white;
padding:20px;
margin-top:20px;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.version{
background:#eefafd;
padding:12px;
margin-top:10px;
border-radius:10px;
}

.editBox{
display:none;
margin-top:15px;
padding:15px;
background:#f7fdff;
border-radius:10px;
border:1px solid #d6eef5;
}

pre{
white-space:pre-wrap;
font-family:inherit;
}

.sectionTitle{
margin-top:40px;
padding-bottom:8px;
border-bottom:3px solid #00b7a8;
}

.search{
margin-bottom:20px;
}
</style>
</head>
<body>

<header>
<h1>Recipes</h1>
<p>Recipe Vault with Version History</p>
</header>

<div class="container">

<input id="search" class="search" placeholder="Search recipes...">

<h2>Add Recipe</h2>

<input id="recipeName" placeholder="Recipe Name">

<textarea id="ingredients" rows="6" placeholder="Ingredients"></textarea>

<textarea id="instructions" rows="8" placeholder="Instructions"></textarea>

<button onclick="addRecipe('vault')">
Save to Recipe Vault
</button>

<button onclick="addRecipe('want')">
⭐ Save to Want to Try
</button>

<h2 class="sectionTitle">📖 Recipe Vault</h2>
<div id="vaultRecipes"></div>

<h2 class="sectionTitle">⭐ Want to Try</h2>
<div id="wantRecipes"></div>

</div>

<script>

let recipes=JSON.parse(localStorage.getItem("recipeVault"))||[];

function saveData(){
localStorage.setItem("recipeVault",JSON.stringify(recipes));
renderRecipes();
}

function addRecipe(section){

const name=document.getElementById("recipeName").value.trim();
if(!name)return;

recipes.push({
id:Date.now(),
section:section,
name:name,
versions:[{
date:new Date().toLocaleString(),
ingredients:document.getElementById("ingredients").value,
instructions:document.getElementById("instructions").value
}]
});

document.getElementById("recipeName").value="";
document.getElementById("ingredients").value="";
document.getElementById("instructions").value="";

saveData();
}

function saveEdit(id){

const recipe=recipes.find(r=>r.id===id);

recipe.versions.push({
date:new Date().toLocaleString(),
ingredients:document.getElementById("editIngredients"+id).value,
instructions:document.getElementById("editInstructions"+id).value
});

saveData();
}

function moveRecipe(id){

const recipe=recipes.find(r=>r.id===id);

recipe.section=
recipe.section==="vault"
?"want"
:"vault";

saveData();

}

function toggle(id){

const box=document.getElementById(id);

box.style.display=
box.style.display==="block"
?"none"
:"block";

}

function renderRecipes(){

const vault=document.getElementById("vaultRecipes");
const want=document.getElementById("wantRecipes");

vault.innerHTML="";
want.innerHTML="";

const search=document.getElementById("search").value.toLowerCase();

recipes
.filter(r=>r.name.toLowerCase().includes(search))
.forEach(recipe=>{

const latest=recipe.versions[recipe.versions.length-1];

const div=document.createElement("div");
div.className="recipe";

div.innerHTML=`

<h3>${recipe.name}</h3>

<p>Versions: ${recipe.versions.length}</p>

<button onclick="toggle('edit${recipe.id}')">
Edit Recipe
</button>

<button onclick="toggle('history${recipe.id}')">
History
</button>

<button onclick="moveRecipe(${recipe.id})">
${recipe.section==="vault"
?"Move to ⭐ Want to Try"
:"Move to 📖 Recipe Vault"}
</button>

<div id="edit${recipe.id}" class="editBox">

<h4>Ingredients</h4>

<textarea id="editIngredients${recipe.id}" rows="6">${latest.ingredients}</textarea>

<h4>Instructions</h4>

<textarea id="editInstructions${recipe.id}" rows="8">${latest.instructions}</textarea>

<button onclick="saveEdit(${recipe.id})">
Save New Version
</button>

</div>

<div id="history${recipe.id}" class="editBox">

${recipe.versions.map(v=>`

<div class="version">

<b>${v.date}</b>

<h4>Ingredients</h4>
<pre>${v.ingredients}</pre>

<h4>Instructions</h4>
<pre>${v.instructions}</pre>

</div>

`).join("")}

</div>

<h4>Current Recipe</h4>

<h4>Ingredients</h4>
<pre>${latest.ingredients}</pre>

<h4>Instructions</h4>
<pre>${latest.instructions}</pre>

`;

if(recipe.section==="vault"){
vault.appendChild(div);
}else{
want.appendChild(div);
}

});

}

document.getElementById("search").addEventListener("input",renderRecipes);

renderRecipes();

</script>

</body>
</html>
